<title>ADBL — Haute Couture</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f2e0d8;
    --rose: #c9967c;
    --dusty: #e8cfc4;
    --cream: #faf6f2;
    --deep: #2a1f1a;
    --warm: #7a4f3a;
    --mist: #ede5e0;
    --gold: #b8976a;
  }
body {
    background: var(--rose);
}
.collections-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;   /* 2 columns */
  gap: 24px;
  background-color: var(--rose);
}

.card-visual {
  width: 100%;
  aspect-ratio: 3 / 4;           /* Balanced height */
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  background: #f8f0eb;
}

.card-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s ease;
}

.collection-card:hover .card-image {
  transform: scale(1.07);
}
  .section-link {
    font-size: 2rem;
    margin: 2rem;
    color: black;
  }
  .section-link:active {
    background-color: black;
    color: white;
    transform: scale(0.8);
  }

/* Mobile - Stack vertically */
@media (max-width: 768px) {
  .collections-grid {
    grid-template-columns: 1fr;
    gap: 32px;
  }
}
  p {
      font-family: Arial, helvetica ,Sans-Serif;
      text-align: center;
      color: var(--cream);
  }
</style>
